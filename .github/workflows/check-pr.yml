name: Check PR

on:
  pull_request:
    # Drafts start the workflow but skip every job, so no runner starts. Marking the PR ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

concurrency:
  group: ruby_${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail and retry a stalled binary-cache download after 30s instead of Nix's 300s default.
  NIX_CONFIG: |
    connect-timeout = 15
    stalled-download-timeout = 30
    download-attempts = 10

permissions:
  contents: read

jobs:
  test:
    name: Lint & test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v31
        # Its curl has no stall timeout; a hung download otherwise blocks the job.
        timeout-minutes: 3
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1G

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: .gems
          key: gems-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'Gemfile.lock') }}

      - name: Install gems
        run: nix develop .#github --command bundle install --jobs 4 --retry 3

      - name: Run RuboCop
        run: nix develop .#github --command bundle exec rubocop

      - name: Run specs
        run: nix develop .#github --command bundle exec rspec
